<title>Decision Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky summary bar, tabs, one dense card per item, a folded Done section, notes box last. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --fg: #1b2030;
  --muted: #5d6578;
  --line: #d9dde6;
  --accent: #2f56d6;
  --accent-fg: #ffffff;
  --now: #b3261e;
  --now-bg: #fbe9e7;
  --soon: #8a5a00;
  --soon-bg: #fcf0d4;
  --later: #4b5468;
  --later-bg: #e6e9f0;
  --good: #1d7a46;
  --good-bg: #e0f3e8;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c;
    --surface: #1a1f2a;
    --surface-2: #232a38;
    --fg: #e6e9f2;
    --muted: #98a1b6;
    --line: #2f3748;
    --accent: #7d9bff;
    --accent-fg: #0f1422;
    --now: #ff8f85;
    --now-bg: #3a1e1c;
    --soon: #f0c05a;
    --soon-bg: #3a2f14;
    --later: #aab3c8;
    --later-bg: #2a3244;
    --good: #6fd09a;
    --good-bg: #17322365;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c;
  --surface: #1a1f2a;
  --surface-2: #232a38;
  --fg: #e6e9f2;
  --muted: #98a1b6;
  --line: #2f3748;
  --accent: #7d9bff;
  --accent-fg: #0f1422;
  --now: #ff8f85;
  --now-bg: #3a1e1c;
  --soon: #f0c05a;
  --soon-bg: #3a2f14;
  --later: #aab3c8;
  --later-bg: #2a3244;
  --good: #6fd09a;
  --good-bg: #17322365;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 20; }
* { box-sizing: border-box; }
button, select, textarea, input { font: inherit; color: inherit; }
.in { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--surface); border-bottom: 1px solid var(--line); }
header.bar .in { padding-block: 10px; display: grid; gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.grow { flex: 1 1 auto; min-width: 0; }
h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
.counts { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.counts b { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; }

button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 10px; min-height: 34px; }
button:hover:not(:disabled) { background: var(--surface-2); }
button:disabled { opacity: 0.5; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
button.link { border: 0; background: none; padding: 2px 4px; min-height: 0; color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.blocked { margin: 10px 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 6px; min-width: 0; }
.blocked h3 { margin: 0; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.blocked h3 .n { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 7px; border-radius: 999px; background: var(--now-bg); color: var(--now); }
.blist { display: grid; gap: 4px; }
.brow { display: grid; gap: 2px; width: 100%; min-width: 0; text-align: left; padding: 6px 8px; min-height: 44px; border-radius: 6px; }
.brow .bt { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
.brow .bt span.tt { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.brow .bb { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.blocks { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; }
.tab { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; min-height: 34px; }
.tab .n { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.tab[aria-selected="true"] .n { color: var(--accent-fg); }
.tab.g { border-style: dashed; max-width: 100%; }
.tab.g .tl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

main.in { padding-bottom: 48px; }
#cards, #donelist { display: grid; gap: 10px; }
.donebox { margin-top: 14px; }
.donebox > summary { font-size: 13px; padding: 6px 0; }
.donebox[open] > summary { margin-bottom: 8px; }
.donebox[hidden] { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.card.done { opacity: 0.8; }
.card.flash, .guide.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.card .gopen { justify-self: start; }
.guide { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; min-width: 0; margin-bottom: 10px; }
.guide[hidden], #cards[hidden] { display: none; }
.guide h2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.guide .gbody { overflow-wrap: anywhere; max-width: 70ch; min-width: 0; }
.guide .gbody.ref { max-width: none; contain: paint; position: relative; overflow: hidden; isolation: isolate; }
.ref .tw { overflow-x: auto; max-width: 100%; }
.gsec { display: grid; gap: 4px; min-width: 0; }
.gsec + .gsec { border-top: 1px solid var(--line); padding-top: 8px; }
.gsec h3 { margin: 0; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--now); }
.about { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.ref table { border-collapse: collapse; margin: 0 0 8px; }
.ref th, .ref td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.ref svg { max-width: 100%; height: auto; }
.ref a { color: var(--accent); }
.changed { font-size: 12.5px; padding: 6px 8px; border-radius: 6px; background: var(--soon-bg); color: var(--soon); overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.tag.now { background: var(--now-bg); color: var(--now); }
.tag.soon { background: var(--soon-bg); color: var(--soon); }
.tag.later { background: var(--later-bg); color: var(--later); }
.tag.agent { border: 1px solid var(--line); background: none; }
.tag.good { background: var(--good-bg); color: var(--good); }
.tag.chip { text-transform: none; letter-spacing: 0; font-weight: 500; border-radius: 999px; padding: 1px 9px; }
.asked { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; min-width: 0; }
.links a { color: var(--accent); overflow-wrap: anywhere; }
.links[hidden], .chips[hidden], .asked[hidden] { display: none; }
.card h2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; text-wrap: balance; }
.summary { margin: 0; overflow-wrap: anywhere; max-width: 70ch; min-width: 0; }
.rich > :first-child { margin-top: 0; }
.rich > :last-child { margin-bottom: 0; }
.rich p { margin: 0 0 8px; }
.rich ul { margin: 0 0 8px; padding-left: 20px; display: grid; gap: 3px; }
.rich ol { margin: 0 0 8px; padding-left: 26px; display: grid; gap: 3px; }
.rich .pre { margin: 0 0 8px; display: grid; gap: 2px; min-width: 0; }
.rich .pre .copy { justify-self: end; font-size: 12px; padding: 2px 10px; min-height: 30px; color: var(--muted); }
.rich pre { margin: 0; padding: 8px; font-family: var(--mono); font-size: 12.5px; line-height: 1.4; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
.rich h4 { margin: 10px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.rich code { font-family: var(--mono); font-size: 0.92em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
.rich strong { font-weight: 600; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details .evidence { margin: 6px 0 0; padding: 8px; background: var(--surface-2); border-radius: 6px; overflow-wrap: anywhere; font-size: 12.5px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 4px; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; min-height: 38px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--surface-2); }
.opt input { margin-top: 3px; accent-color: var(--accent); flex: none; }
.opt span.t { min-width: 0; overflow-wrap: anywhere; }
.rec { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--good); background: var(--good-bg); border-radius: 4px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
textarea { width: 100%; resize: vertical; min-height: 52px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; min-height: 18px; }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); }
.msg { padding: 8px 10px; border-radius: 6px; background: var(--now-bg); color: var(--now); }
.notes { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.notes h3 { margin: 0; font-size: 13px; font-weight: 600; }
.nlist { display: grid; gap: 4px; }
.nitem { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; padding: 6px 8px; background: var(--surface-2); border-radius: 6px; }
.nitem span { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
@media (prefers-reduced-motion: no-preference) { .card, .guide, .opt { transition: border-color 0.12s, background 0.12s, box-shadow 0.3s; } }
</style>

<header class="bar">
  <div class="in">
    <div class="row">
      <h1 id="ttl" class="grow">Decision board</h1>
      <span id="sync" class="small muted" aria-live="polite">Loading</span>
      <button id="refresh" type="button" title="Reload from the database">Refresh</button>
    </div>
    <div class="row">
      <div class="counts"><span>Open <b id="c-open">0</b></span><span>Unsent <b id="c-unsent">0</b></span></div>
      <span id="lastbatch" class="small muted grow"></span>
      <span id="refreshed" class="small muted"></span>
      <button id="send" class="primary" type="button" disabled>Send (0)</button>
    </div>
  </div>
</header>

<div class="in">
  <section id="blocked" class="blocked" aria-label="Blocked on you"></section>
  <div id="tabs" class="tabs" role="tablist" aria-label="Board tabs"></div>
</div>

<main class="in">
  <div id="msg" class="msg" hidden role="alert"></div>
  <section id="guide" class="guide" hidden aria-label="Guide"></section>
  <div id="cards"></div>
  <div id="empty" class="empty" hidden></div>
  <details id="done" class="donebox" hidden><summary id="donesum">Done</summary><div id="donelist"></div></details>
  <section class="notes" aria-label="New note">
    <h3>New note</h3>
    <div id="about" class="about" hidden></div>
    <textarea id="newnote" placeholder="A message that is not tied to an item. It goes out with the next batch."></textarea>
    <div class="row"><button id="addnote" type="button">Add note</button><span id="notestate" class="small muted"></span></div>
    <div id="nlist" class="nlist"></div>
  </section>
  <section id="archived" class="notes" hidden aria-label="Archived guides"></section>
</main>

<script>
(function () {
  "use strict";
  var FKEY = "decision-board-filter-v1", SKEY = "decision-board-seen-v1";
  var db = null;
  var cardDocs = new Map(), items = new Map(), resp = new Map(), batches = new Map(), notes = new Map(), guides = new Map(), acks = new Map();
  var meta = null;
  var loaded = { cards: false, items: false, responses: false, batches: false, notes: false, guides: false, acks: false, config: false };
  var cards = new Map();      // itemId -> {el, n, ...refs}. n is the card number, the source of every DOM id of the card.
  var timers = new Map();     // itemId -> debounce timer
  var inflight = new Map();   // itemId -> number of writes in flight
  var chains = new Map();     // itemId -> promise chain
  var lastDoc = new Map();    // itemId -> the response this page wrote last, until a snapshot confirms it
  var sending = false, totalInflight = 0, lastSaved = "", cardSeq = 0, noteItem = "";
  var f = { tab: "all" };
  var seen = {};              // guide id -> the "updated" of a status guide when this viewer last looked

  function $(id) { return document.getElementById(id); }
  function h(tag, attrs) {
    var e = document.createElement(tag), k, v, kids = Array.prototype.slice.call(arguments, 2);

  }
  function rid() { return Math.random().toString(36).slice(2, 6); }
  function stamp() { return iso().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z"); }

  try { var raw = localStorage.getItem(FKEY); if (raw) { var o = JSON.parse(raw); if (o && typeof o.tab === "string") f.tab = o.tab; } } catch (e) {}

  function errText(e) { return e && (e.code || e.message) ? (e.code || "") + " " + (e.message || "") : String(e); }
  function isPending(id) { return timers.has(id) || (inflight.get(id) || 0) > 0; }

  // ---- pure: start. No DOM below this line until "pure: end". The node tests and scripts/board.mjs load this part.
  // ---- schema: the one definition of fields, kinds and limits. scripts/board.mjs reads it from here.
  // Field types: s short text, t long text, g guide text, l list of texts, L list of texts or absent,
  // S text or absent, r revision (a whole number, default 1), b true or false, a:<kind> list of
  // objects, m:<kind> map from an id to an object, o:<kind> one object or absent.
  var SCHEMA = {
    max: { list: 50, options: 8, links: 10, s: 300, t: 20000, g: 200000 },
    idRe: /^(?!\.\.?$)[A-Za-z0-9_\-.~:@+]{1,100}$/,
    // One document per agent: cards/<agent key> holds that agent's list and the time of its last sync.
    cards: { cards: "a:item", refreshed: "s" },
    agentRe: /^[a-z0-9_\-~@+]{1,40}$/,
    item: { id: "s", title: "s", summary: "t", evidence: "t", options: "L", recommendation: "s", priority: "s",
      source: "s", rev: "r", kind: "s", blocks: "s", status: "s", created: "s", updated: "s",
      links: "a:link", tags: "l", first_asked: "o:asked" },
    link: { label: "s", url: "t" },
    asked: { date: "s", who: "s" },
    response: { itemId: "s", choice: "s", note: "t", rev: "r", "for": "S", updated: "s", sent: "b", batch: "s", history: "a:hist" },
    hist: { choice: "s", note: "t", rev: "r", updated: "s", batch: "s" },
    batch: { id: "s", created: "s", "for": "s", itemIds: "l", noteIds: "l", answers: "m:answer", notes: "m:bnote", status: "s", delivered_at: "s" },
    answer: { answer: "s", note: "t", rev: "r" },
    bnote: { text: "t", item: "s" },
    note: { id: "s", text: "t", item: "s", "for": "S", created: "s", sent: "b", batch: "s" },
    guide: { id: "s", kind: "s", title: "s", body: "g", sections: "a:section", status: "s", created: "s", updated: "s", item: "s" },
    section: { id: "s", title: "s", body: "g", updated: "s" },
    ack: { at: "s", items: "l" },
    kinds: [{ id: "decision", label: "Decision" },
      { id: "action", label: "Action", options: ["Done", "Done in part, see note", "Later", "Other, see note"] },
      { id: "info", label: "Info", options: ["Acknowledge"] }],
    guideKinds: ["text", "status", "reference"],
    statuses: ["open", "closed"],
    labels: ["Before", "Now", "Suggested", "Why", "Risk", "Your answer"]

  function own(o, k) { return o != null && Object.prototype.hasOwnProperty.call(o, k); }
  function isObj(v) { return !!v && typeof v === "object" && !Array.isArray(v); }

    var now = iso();
    db.doc("guides/" + id).update({ status: status, updated: now }).then(function () {
      var g = guides.get(id);
      if (g) { g.status = status; g.updated = now; }
      showMsg("");
      if (status === "active") openGuide(id); else { saveFilter(); render(); }
    }, function (e) { showMsg("The guide was not saved: " + errText(e)); });
  }
  function renderNotes() {
    var box = $("nlist"), ab = $("about"), it = noteItem ? items.get(noteItem) : null;
    if (noteItem && !it) noteItem = "";
    ab.hidden = !it;
    ab.textContent = "";
    if (it) ab.append(h("span", { class: "grow", text: "About: " + (it.title || it.id) }),
      h("button", { class: "link small", type: "button", text: "Not about a card", onclick: function () { noteItem = ""; render(); } }));
    box.textContent = "";
    Array.from(notes.values()).filter(function (x) { return !x.sent; })
      .sort(function (a, b) { return a.created < b.created ? -1 : 1; })
      .forEach(function (x) {
        var about = x.item && items.get(x.item);
        box.append(h("div", { class: "nitem" }, h("span", { text: (about ? "About “" + (about.title || about.id) + "”: " : "") + x.text }),
          h("button", { class: "link small", type: "button", text: "Remove", onclick: function () { removeNote(x.id); } })));
      });
  }
  function renderSync() {
    var s = $("sync");
    if (!db) s.textContent = "No database";
    else if (totalInflight > 0 || timers.size > 0) s.textContent = "Saving";
    else if (!(loaded.items && loaded.responses)) s.textContent = "Loading";
    else s.textContent = lastSaved ? "Saved " + lastSaved : "Live";
  }
  var raf = 0;
  function schedule() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; render(); }); }

  // ---- writes. One chain per item, so each write sees the one before it.
  function enqueue(key, fn) {
    var prev = chains.get(key) || Promise.resolve();
    var p = prev.catch(function () {}).then(fn);
    chains.set(key, p);
    return p;
  }
  function flushItem(id) {
    if (timers.has(id)) { clearTimeout(timers.get(id)); timers.delete(id); }
    return saveResponse(id);
  }
  function saveResponse(id) {
    var c = cards.get(id);
    if (!c || c.broken || !db) return Promise.resolve();
    var checked = c.fs.querySelector("input[type=radio]:checked");
    var choice = checked ? checked.value : "", note = c.ta.value, prev = null;
    inflight.set(id, (inflight.get(id) || 0) + 1); totalInflight++;
    setSave(c, "Saving"); renderSync();
    return enqueue(id, function () {
      prev = resp.get(id) || null;
      var rev = revOf(c.it);
      // Nothing changed: no write. The same answer on a card with a newer rev is a new answer.
      if (prev ? prev.choice === choice && prev.note === note && revOf(prev) === rev : !choice && !note) return null;
      var doc = nextResponse(prev, id, choice, note, rev, agentKey(c.it.agent), iso());
      lastDoc.set(id, doc); resp.set(id, doc);
      return db.doc("responses/" + id).set(doc).then(function () {
        lastSaved = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        showMsg("");
      });
    }).catch(function (e) {
      lastDoc.delete(id);
      if (prev) resp.set(id, prev); else resp.delete(id);
      setSave(c, "Not saved: " + errText(e));
      showMsg("A save failed: " + errText(e));
    }).then(function () {
      inflight.set(id, inflight.get(id) - 1); totalInflight--;
      schedule();
    });
  }
  function flushAll() {
    var ps = [];
    Array.from(timers.keys()).forEach(function (id) { ps.push(flushItem(id)); });
    Array.from(chains.values()).forEach(function (p) { ps.push(p.catch(function () {})); });
    return Promise.all(ps);
  }
  function addNote() {
    var t = $("newnote").value.trim();
    if (!t || !db) return;
    var id = "n" + stamp() + "-" + rid(), it = noteItem ? items.get(noteItem) : null;
    var doc = { id: id, text: t, item: it ? it.id : "", "for": agentKey(it ? it.agent : ""), created: iso(), sent: false, batch: "" };
    $("notestate").textContent = "Saving";
    db.doc("notes/" + id).set(doc).then(function () {
      $("newnote").value = ""; noteItem = ""; $("notestate").textContent = "Added, goes out with the next batch"; schedule();
    }, function (e) { $("notestate").textContent = "Not saved: " + errText(e); });
  }
  function removeNote(id) { if (db) db.doc("notes/" + id).delete().catch(function (e) { showMsg(errText(e)); }); }

  // Send: one batch per agent. The page first writes the batch with a copy of every answer and note,
  // and only then marks them sent. A failure before the batch leaves everything unsent; a failure
  // after it can send an answer twice, never lose one. An answer changed during the send stays unsent.
  function sendGroup(gp) {
    var bid = "b" + stamp() + "-" + rid();
    return db.doc("batches/" + bid).set(batchDoc(bid, iso(), gp)).then(function () {
      var marks = gp.r.map(function (x) {
        return enqueue(x.itemId, function () {
          var cur = resp.get(x.itemId);
          if (!cur || cur.sent || cur.updated !== x.updated) return null;
          var d = Object.assign({}, cur, { sent: true, batch: bid, updated: iso() });
          lastDoc.set(x.itemId, d); resp.set(x.itemId, d);
          return db.doc("responses/" + x.itemId).set(d);
        });
      }).concat(gp.n.map(function (x) {
        return db.doc("notes/" + x.id).update({ sent: true, batch: bid }).then(function () { var nn = notes.get(x.id); if (nn) { nn.sent = true; nn.batch = bid; } });
      }));
      return Promise.all(marks).then(null, function (e) { throw { stage: "mark", bid: bid, e: e }; });
    }, function (e) { throw { stage: "batch", e: e }; });
  }
  function send() {
    if (sending || !ready()) return;
    sending = true; render();
    flushAll().then(function () {
      var seq = Promise.resolve();
      splitByAgent(sendable()).forEach(function (gp) { seq = seq.then(function () { return sendGroup(gp); }); });
      return seq;
    }).then(function () { showMsg(""); }, function (x) {
      if (x && x.stage === "mark") showMsg("Batch " + x.bid + " went out, but some answers were not marked sent: " + errText(x.e) + ". They can go out again.");
      else if (x && x.stage === "batch") showMsg("Send failed, nothing went out: " + errText(x.e));
      else showMsg("Send failed: " + errText(x));
    }).then(function () { sending = false; schedule(); });
  }

  // ---- reads. Every document goes through coerce. For responses, the newer copy wins over a late
  // get(), and a copy that this page wrote wins until a live snapshot confirms it.
  var KIND = { cards: "cards", responses: "response", batches: "batch", notes: "note", guides: "guide", acks: "ack" };
  function applySnap(map, snap, name, isGet) {
    var next = new Map();
    snap.docs.forEach(function (d) {
      if (!d.exists) return;
      try {
        var x = coerce(KIND[name], d.data());
        if (own(x, "id")) x.id = d.id;
        if (name === "responses") x.itemId = d.id;
        next.set(d.id, x);
      } catch (e) { /* an unreadable document is left out */ }
    });
    if (name === "responses") {
      // A get() can answer late, after newer writes: there every copy already held that is newer wins.
      if (isGet) map.forEach(function (held, id) { if (newerDoc(next.get(id), held) === held) next.set(id, held); });
      lastDoc.forEach(function (mine, id) {
        var got = next.get(id);
        if (newerDoc(got, mine) === mine) next.set(id, mine); else if (!isGet) lastDoc.delete(id);
      });
    }
    map.clear();
    next.forEach(function (v, k) { map.set(k, v); });
    loaded[name] = true;
    if (name === "cards") { items = mergeCards(map); loaded.items = true; }
    schedule();
  }
  function applyMeta(d) { var x = d && d.exists ? d.data() : null; meta = isObj(x) ? x : null; schedule(); }
  function applyConfigDoc(d) { applyConfig(d && d.exists ? d.data() : null); loaded.config = true; schedule(); }
  var COLS = [["cards", cardDocs], ["responses", resp], ["batches", batches], ["notes", notes], ["guides", guides], ["acks", acks]];
  function refresh() {
    if (!db) return;
    $("refresh").disabled = true;
    Promise.all(COLS.map(function (c) { return db.collection(c[0]).get().then(function (s) { applySnap(c[1], s, c[0], true); }); }))
      .then(function () { return Promise.all([db.doc("meta/board").get(), db.doc("meta/config").get()]); })
      .then(function (d) { applyMeta(d[0]); applyConfigDoc(d[1]); })
      .catch(function (e) { showMsg("Refresh failed: " + errText(e)); })
      .then(function () { $("refresh").disabled = false; });
  }
  function start(dbns) {
    db = dbns;
    if (!db) { showMsg("The database is not available in this view. Sign in, or open the page in claude.ai."); $("empty").textContent = "No database."; renderSync(); return; }
    var t = setTimeout(function () { if (!(loaded.items && loaded.responses)) { $("sync").textContent = "Cannot reach the database yet"; } }, 10000);
    COLS.forEach(function (c) {
      db.collection(c[0]).onSnapshot(function (s) {
        applySnap(c[1], s, c[0], false);
        if (loaded.items && loaded.responses) clearTimeout(t);
      }, function (e) { loaded[c[0]] = true; showMsg(c[0] + ": " + errText(e)); });
    });
    db.doc("meta/board").onSnapshot(applyMeta, function () {});
    db.doc("meta/config").onSnapshot(applyConfigDoc, function () { applyConfigDoc(null); });
  }

  // ---- wiring
  $("send").addEventListener("click", send);
  $("refresh").addEventListener("click", refresh);
  $("addnote").addEventListener("click", addNote);
  // Copy button of a preformatted block. If the clipboard is closed, select the text instead.
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest("button.copy") : null;
    var pre = b ? b.parentNode.querySelector("pre") : null;
    if (!pre) return;
    function done(ok) { b.textContent = ok ? "Copied" : "Selected. Copy it by hand"; setTimeout(function () { b.textContent = "Copy"; }, 1800); }
    function bySelection() {
      var ok = false;
      try {
        var r = document.createRange(), sel = window.getSelection();
        r.selectNodeContents(pre); sel.removeAllRanges(); sel.addRange(r);
        ok = document.execCommand("copy");
        if (ok) sel.removeAllRanges();
      } catch (err) {}
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(pre.textContent).then(function () { done(true); }, bySelection);
    else bySelection();
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  window.addEventListener("focus", refresh);

  render();
  if (window.claude && window.claude.use) {
    window.claude.use("db").then(start, function () { start(null); });
  } else { start(null); }
})();
</script>
